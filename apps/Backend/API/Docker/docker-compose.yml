services:
  psql:
    image: timescale/timescaledb:latest-pg18
    container_name: vgt7psql
    environment:
      POSTGRES_DB: vgt7db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vgt7db"]
      interval: 1s
      timeout: 1s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vgt7api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PSQL=Host=psql;Port=5432;Database=vgt7db;Username=postgres;Password=yourpassword;
    depends_on:
      psql:
        condition: service_healthy
    volumes:
      - dp_keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  pgdata:
  dp_keys: